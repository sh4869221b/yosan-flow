name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare Nix store directory
        run: |
          if [ ! -d /nix ]; then
            sudo install -d -m 0755 -o "$USER" -g "$(id -gn)" /nix
          fi

      - name: Restore Nix store
        id: nix-cache
        uses: actions/cache@v5
        with:
          path: |
            /nix
            ~/.cache/nix
          key: nix-e2e-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', '.node_version', 'package.json', 'scripts/install-nix-e2e.sh', 'scripts/nix-e2e.sh', 'scripts/nix-e2e.ts', 'scripts/pnpm-e2e.ts') }}

      - name: Install Nix
        env:
          NIX_CACHE_HIT: ${{ steps.nix-cache.outputs.cache-hit }}
        run: bash scripts/install-nix-e2e.sh

      - name: Record runner and Nix cache
        env:
          NIX_CACHE_HIT: ${{ steps.nix-cache.outputs.cache-hit }}
        run: |
          mkdir -p .tmp-nix-e2e
          python3 - <<'PYTHON'
          import json, os
          keys = ['ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH', 'NIX_CACHE_HIT', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB']
          with open('.tmp-nix-e2e/runner.json', 'w') as output:
              json.dump({key: os.environ.get(key) for key in keys}, output)
          PYTHON

      - name: Prepare Nix tools
        run: bash scripts/nix-e2e.sh tools

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-nix-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'flake.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nix Playwright browser
        id: e2e-browser
        background: true
        run: bash scripts/nix-e2e.sh browsers

      - name: Build E2E application
        id: e2e-build
        background: true
        run: node scripts/e2e-build.ts build

      - name: Wait for E2E prerequisites
        wait: [e2e-browser, e2e-build]

      - name: Run E2E tests
        env:
          YOSAN_FLOW_E2E_PREBUILT: "1"
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            .tmp-xdg-config/.wrangler/logs/
            .tmp-nix-e2e/japanese-font.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Upload E2E timing
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            test-results/results.json
            .tmp-e2e-timing.json
            .tmp-nix-e2e/*-timing.json
            .tmp-nix-e2e/manifest.json
            .tmp-nix-e2e/runner.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  e2e-summary:
    name: E2E timing summary
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version

      - name: Summarize completed E2E job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp-e2e-summary
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > .tmp-e2e-summary/jobs.json
          summary_status=0
          for shard in 1 2; do
            artifact_name="e2e-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-shard-$shard"
            if artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id"); then
              if [ -n "$artifact_id" ]; then
                if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir ".tmp-e2e-summary/shard-$shard"; then
                  summary_status=1
                fi
              fi
            else
              summary_status=1
            fi
            if ! node scripts/e2e-summary.ts --report ".tmp-e2e-summary/shard-$shard/test-results/results.json" --timing ".tmp-e2e-summary/shard-$shard/.tmp-e2e-timing.json" --jobs .tmp-e2e-summary/jobs.json --job-name "Playwright E2E (shard $shard/2)" | tee -a "$GITHUB_STEP_SUMMARY"; then
              summary_status=1
            fi
          done
          exit "$summary_status"
