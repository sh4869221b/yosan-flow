name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Unique non-PR groups also avoid cancelling a pending main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify PR changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
      - name: Classify complete PR diff
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.ts

  format-lint:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:ci

  check:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check:ci

  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Fallow baselines
        run: pnpm fallow:ci

      - name: Upload Fallow reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fallow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp-fallow-ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration

  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration metadata, schema, data and local D1
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm db:verify

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e-shard-1:
    name: E2E tests (shard 1/2)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    env:
      E2E_SHARD: 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: &e2e-steps
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Identify APT archive cache
        id: e2e-apt-key
        run: bash scripts/e2e-apt-cache.sh key

      - name: Restore APT archives
        id: e2e-apt-cache
        uses: actions/cache@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: .tmp-e2e-apt-cache/*.deb
          key: ${{ steps.e2e-apt-key.outputs.key }}

      - name: Install Playwright browser
        id: e2e-browser
        background: true
        run: bash scripts/e2e-apt-cache.sh install

      - name: Build E2E application
        id: e2e-build
        background: true
        run: node scripts/e2e-build.ts build

      - name: Wait for E2E prerequisites
        wait: [e2e-browser, e2e-build]

      - name: E2E tests
        env:
          YOSAN_FLOW_E2E_PREBUILT: "1"
        run: pnpm test:e2e --shard=${{ env.E2E_SHARD }}/2

      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ env.E2E_SHARD }}
          path: |
            test-results/
            playwright-report/
            .tmp-xdg-config/.wrangler/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Upload E2E timing
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ env.E2E_SHARD }}
          path: |
            test-results/results.json
            .tmp-e2e-timing.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  e2e-shard-2:
    name: E2E tests (shard 2/2)
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    env:
      E2E_SHARD: 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: *e2e-steps

  e2e-summary:
    name: E2E timing summary
    needs: [changes, e2e-shard-1, e2e-shard-2]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version

      - name: Record intentional E2E skip
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          test "${{ needs['e2e-shard-1'].result }}" = "skipped"
          test "${{ needs['e2e-shard-2'].result }}" = "skipped"
          echo 'Both E2E shards intentionally skipped for the complete docs-only PR diff; E2E runner time is 0 seconds.' >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize completed E2E job
        if: ${{ !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp-e2e-summary
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > .tmp-e2e-summary/jobs.json
          summary_status=0
          for shard in 1 2; do
            artifact_name="e2e-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-shard-$shard"
            if artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id"); then
              if [ -n "$artifact_id" ]; then
                if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir ".tmp-e2e-summary/shard-$shard"; then
                  summary_status=1
                fi
              fi
            else
              summary_status=1
            fi
            if ! node scripts/e2e-summary.ts --report ".tmp-e2e-summary/shard-$shard/test-results/results.json" --timing ".tmp-e2e-summary/shard-$shard/.tmp-e2e-timing.json" --jobs .tmp-e2e-summary/jobs.json --job-name "E2E tests (shard $shard/2)" | tee -a "$GITHUB_STEP_SUMMARY"; then
              summary_status=1
            fi
          done
          exit "$summary_status"

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs:
      - changes
      - format-lint
      - check
      - fallow
      - unit-tests
      - integration-tests
      - migrations
      - build
      - e2e-shard-1
      - e2e-shard-2
    if: ${{ always() }}

    steps:
      - name: Verify required CI jobs
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          test "${{ needs.changes.result }}" = "success"
          case "$DOCS_ONLY" in
            true) expected_e2e=skipped ;;
            false) expected_e2e=success ;;
            *) echo "Missing or invalid change classification" >&2; exit 1 ;;
          esac
          test "${{ needs['format-lint'].result }}" = "success"
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.fallow.result }}" = "success"
          test "${{ needs['unit-tests'].result }}" = "success"
          test "${{ needs['integration-tests'].result }}" = "success"
          test "${{ needs.migrations.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs['e2e-shard-1'].result }}" = "$expected_e2e"
          test "${{ needs['e2e-shard-2'].result }}" = "$expected_e2e"
