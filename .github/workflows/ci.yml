name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format-lint:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  check:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            .tmp-xdg-config/.wrangler/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Upload E2E timing
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            test-results/results.json
            .tmp-e2e-timing.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  e2e-summary:
    name: E2E timing summary
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node_version

      - name: Summarize completed E2E job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp-e2e-summary
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > .tmp-e2e-summary/jobs.json
          summary_status=0
          for shard in 1 2; do
            artifact_name="e2e-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-shard-$shard"
            if artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id"); then
              if [ -n "$artifact_id" ]; then
                if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir ".tmp-e2e-summary/shard-$shard"; then
                  summary_status=1
                fi
              fi
            else
              summary_status=1
            fi
            if ! node scripts/e2e-summary.ts --report ".tmp-e2e-summary/shard-$shard/test-results/results.json" --timing ".tmp-e2e-summary/shard-$shard/.tmp-e2e-timing.json" --jobs .tmp-e2e-summary/jobs.json --job-name "E2E tests (shard $shard/2)" | tee -a "$GITHUB_STEP_SUMMARY"; then
              summary_status=1
            fi
          done
          exit "$summary_status"

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs:
      - format-lint
      - check
      - unit-tests
      - integration-tests
      - build
      - e2e
    if: ${{ always() }}

    steps:
      - name: Verify required CI jobs
        run: |
          test "${{ needs['format-lint'].result }}" = "success"
          test "${{ needs.check.result }}" = "success"
          test "${{ needs['unit-tests'].result }}" = "success"
          test "${{ needs['integration-tests'].result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
